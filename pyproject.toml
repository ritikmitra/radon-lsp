[project]
name = "radon-lsp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ritik Mitra", email = "ritikmitra36@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygls>=2.1.1",
    "radon>=6.0.1",
]

[project.scripts]
radon-lsp = "radon_lsp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pygls.feature_manager"
]
